name: Changesets PR Status

# `pull_request_target` supports PRs from forks: no PR code is executed here
on:
  pull_request_target:

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  pr-status:
    name: Generate PR status
    # skip the release PR opened by `changesets/action`: it never has changesets
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'changeset-release/') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read # to check out repo (actions/checkout)

    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate PR status
        id: pr-status
        uses: changesets/action/pr-status@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0

  pr-comment:
    name: Comment on PR
    needs: pr-status
    runs-on: ubuntu-latest

    # the comment is posted with the release helper app token
    permissions: {}

    steps:
      - name: Setup release helper
        id: release-helper
        uses: marcalexiei/github-actions/setup-github-app-user-bot@e3b04865510c657477cc722854b31a3b74c72c09 # v2.2.0
        with:
          app-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}

      - name: Comment on PR
        uses: changesets/action/pr-comment@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          github-token: ${{ steps.release-helper.outputs.token }}
          body: ${{ needs.pr-status.outputs.comment-body }}
